version: '3.8'

services:
  jobhandling-api:
    build:
      context: .
      dockerfile: JobHandling.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=${JWT_KEY:-THIS_IS_A_SUPER_SECRET_KEY_123456789}
      - Jwt__Issuer=${JWT_ISSUER:-JobHandlingAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-JobHandlingClient}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped